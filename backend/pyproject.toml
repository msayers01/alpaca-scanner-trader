[project]
name = "vantage"
version = "0.1.0"
description = "Vantage — quantitative trading workstation for Alpaca"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28",
    "websockets>=15",
    "orjson>=3.10",
    "msgpack>=1.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "scipy>=1.14",
    "tzdata>=2025.1",
    "defusedxml>=0.7",
]

[project.scripts]
vantage = "vantage.main:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vantage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM102", "SIM103", "SIM108", "SIM300", "E741"]
